; PlatformIO-Projekt für den ESP32-S3 Zero (Waveshare) mit INMP441-Mikrofon.
;
; Der ESP32-S3 Zero hat 4 MB Flash, kein PSRAM und native USB-CDC. Es gibt keine
; dedizierte PlatformIO-Board-Definition dafür – wir nutzen das generische
; esp32-s3-devkitc-1 mit passenden Overrides (4 MB, Standard-Partitionstabelle).

[env:esp32-s3-zero]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; An den ESP32-S3 Zero anpassen (4 MB Flash, kein PSRAM)
board_upload.flash_size = 4MB
board_build.partitions = default.csv

monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=2
    ; Native USB als serielle Konsole (ESP32-S3 Zero hat nur den USB-C-Port)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; -----------------------------------------------------------------------------
; Alternative: ESP32-C3 Super Mini (4 MB Flash, 1x I2S, native USB-CDC).
; Bauen/Flashen mit:  pio run -e esp32-c3-supermini --target upload
; Vorher in src/config.h die C3-Pin-/LED-Werte setzen (siehe config.h.example).
[env:esp32-c3-supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino

board_upload.flash_size = 4MB
board_build.partitions = default.csv

monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
