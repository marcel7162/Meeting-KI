; PlatformIO-Projekt für den ESP32-S3 mit INMP441-Mikrofon.
;
; Firmware nimmt Audio über I2S auf und streamt es per TCP an den Python-Server.
; Passe ggf. das `board` an dein konkretes ESP32-S3-Modul an
; (z. B. esp32-s3-devkitc-1, lolin_s3, adafruit_feather_esp32s3 ...).

[env:esp32-s3-devkitc-1]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Serielle Ausgabe zum Mitlesen
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=2
    ; USB-CDC als serielle Konsole (viele S3-Boards brauchen das)
    -DARDUINO_USB_CDC_ON_BOOT=1
